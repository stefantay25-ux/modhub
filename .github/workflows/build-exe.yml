name: Build ModHub apps

# Every time a new modhub.py is pushed, GitHub builds ModHub for Windows and Mac
# and puts them on the Releases page. The website's Download buttons always get the newest ones.
on:
  push:
    branches: [main]
    paths: ["modhub.py", "exe/**", ".github/workflows/build-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apps
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the builder
        run: python -m pip install --upgrade pip pyinstaller pywebview
      - name: Make the icon and release notes
        run: python exe/prepare.py
      - name: Build ModHub.exe
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ModHub --icon build/modhub.ico
          --add-data "modhub.py;." --paths .
          --collect-all webview --collect-all pythonnet --collect-all clr_loader
          --hidden-import clr --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms
          exe/launcher.py
      - name: Check that it starts
        shell: pwsh
        run: |
          $p = Start-Process dist\ModHub.exe -ArgumentList "--no-browser","--port","47999" -PassThru
          $code = 0
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { Invoke-WebRequest http://127.0.0.1:47999/ -UseBasicParsing | Out-Null; $code = 200 }
            catch { if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode } }
            if ($code -ne 0) { break }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process ModHub -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($code -ne 403) {
            Write-Host "ModHub.exe didn't start (got $code). Its log:"
            Get-Content "$env:USERPROFILE\.modhub\modhub.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "ModHub.exe started and answered, as it should."
      - name: Check that its own window opens
        shell: pwsh
        run: |
          $dir = "$env:USERPROFILE\.modhub"
          Remove-Item "$dir\running.json", "$dir\modhub.log" -ErrorAction SilentlyContinue
          $p = Start-Process dist\ModHub.exe -PassThru
          $result = "no answer"
          foreach ($i in 1..40) {
            Start-Sleep 2
            if (-not (Test-Path "$dir\running.json")) { continue }
            try {
              $info = Get-Content "$dir\running.json" -Raw | ConvertFrom-Json
              $s = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$($info.port)/api/state" -Headers @{ "X-Token" = $info.token } -ContentType "application/json" -Body "{}"
              if ($s.native) { $result = "window open"; break }
              if ($s.native_broken) { $result = "window failed: $($s.native_broken.reason)"; break }
            } catch {}
          }
          Write-Host "Result: $result"
          Write-Host "---- ModHub's log ----"
          Get-Content "$dir\modhub.log" -ErrorAction SilentlyContinue | Select-Object -Last 120
          Get-Process ModHub -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($result -ne "window open") { exit 1 }
          Write-Host "ModHub opened its own window, as it should."
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/ModHub.exe
            build/notes.md

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple chips
            zip: ModHub-mac.zip
          - runner: macos-15-intel     # older Intel Macs
            zip: ModHub-mac-intel.zip
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.zip == 'ModHub-mac-intel.zip' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the builder
        run: python -m pip install --upgrade pip pyinstaller pywebview
      - name: Make the icon
        run: python exe/prepare.py
      - name: Build ModHub.app
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name ModHub --icon build/modhub.icns
          --osx-bundle-identifier io.github.modhub-mc
          --add-data "modhub.py:." --paths .
          --collect-all webview
          exe/launcher.py
      - name: Finish the app
        run: |
          v=$(python -c "import re;print(re.search(r'^APP_VERSION = \"([^\"]+)\"', open('modhub.py', encoding='utf-8').read(), re.M).group(1))")
          plist=dist/ModHub.app/Contents/Info.plist
          plutil -replace LSUIElement -bool true "$plist"
          plutil -replace CFBundleShortVersionString -string "$v" "$plist"
          plutil -replace CFBundleVersion -string "$v" "$plist"
          codesign --force --deep -s - dist/ModHub.app
      - name: Check that it starts
        run: |
          dist/ModHub.app/Contents/MacOS/ModHub --no-browser --port 47999 &
          pid=$!
          code=000
          for i in $(seq 1 30); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:47999/ || true)
            [ "$code" != "000" ] && break
          done
          kill $pid 2>/dev/null || true
          pkill -f ModHub.app 2>/dev/null || true
          if [ "$code" != "403" ]; then
            echo "ModHub.app didn't start (got $code). Its log:"
            cat ~/.modhub/modhub.log 2>/dev/null || true
            exit 1
          fi
          echo "ModHub.app started and answered, as it should."
      - name: Zip it
        run: ditto -c -k --keepParent dist/ModHub.app "${{ matrix.zip }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  publish:
    needs: [windows, mac]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import re;print(re.search(r'^APP_VERSION = \"([^\"]+)\"', open('modhub.py', encoding='utf-8').read(), re.M).group(1))")
          tag="v$v"
          files="out/windows/dist/ModHub.exe"
          for z in ModHub-mac.zip ModHub-mac-intel.zip; do
            [ -f "out/$z/$z" ] && files="$files out/$z/$z"
          done
          echo "Publishing $tag: $files"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --title "ModHub $v" --notes-file out/windows/build/notes.md --latest
          fi

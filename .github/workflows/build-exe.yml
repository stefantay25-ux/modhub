name: Build ModHub apps

# Every time a new modhub.py is pushed, GitHub builds ModHub for Windows and Mac
# and puts them on the Releases page. The website's Download buttons always get the newest ones.
on:
  push:
    branches: [main]
    paths: ["modhub.py", "exe/**", ".github/workflows/build-exe.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apps
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the builder
        run: python -m pip install --upgrade pip pyinstaller pywebview
      - name: Make the icon and release notes
        run: python exe/prepare.py
      - name: Build ModHub.exe
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ModHub --icon build/modhub.ico
          --add-data "modhub.py;." --paths .
          --collect-all webview --collect-all pythonnet --collect-all clr_loader
          --hidden-import clr --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms
          exe/launcher.py
      - name: Scan it with Microsoft Defender
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate | Out-Host
          $st = Get-MpComputerStatus
          & $mp -Scan -ScanType 3 -File "$PWD\dist\ModHub.exe" -DisableRemediation | Out-Host
          $code = $LASTEXITCODE
          $result = if ($code -eq 0) { "clean" } elseif ($code -eq 2) { "threat" } else { "error" }
          @{ engine = "Microsoft Defender"; result = $result; version = "$($st.AntivirusSignatureVersion)"; files = @("ModHub.exe") } | ConvertTo-Json -Compress | Set-Content build/defender.json -Encoding utf8
          Write-Host "Microsoft Defender: $result (definitions $($st.AntivirusSignatureVersion))"
          if ($result -eq "threat") { Write-Host "Defender flagged ModHub.exe, so it won't be published."; exit 1 }
          exit 0
      - name: Check that it starts
        shell: pwsh
        run: |
          $p = Start-Process dist\ModHub.exe -ArgumentList "--no-browser","--port","47999" -PassThru
          $code = 0
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { Invoke-WebRequest http://127.0.0.1:47999/ -UseBasicParsing | Out-Null; $code = 200 }
            catch { if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode } }
            if ($code -ne 0) { break }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process ModHub -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($code -ne 403) {
            Write-Host "ModHub.exe didn't start (got $code). Its log:"
            Get-Content "$env:USERPROFILE\.modhub\modhub.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "ModHub.exe started and answered, as it should."
      - name: Check that its own window opens
        shell: pwsh
        run: |
          $dir = "$env:USERPROFILE\.modhub"
          Remove-Item "$dir\running.json", "$dir\modhub.log" -ErrorAction SilentlyContinue
          $p = Start-Process dist\ModHub.exe -PassThru
          $result = "no answer"
          foreach ($i in 1..40) {
            Start-Sleep 2
            if (-not (Test-Path "$dir\running.json")) { continue }
            try {
              $info = Get-Content "$dir\running.json" -Raw | ConvertFrom-Json
              $s = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$($info.port)/api/state" -Headers @{ "X-Token" = $info.token } -ContentType "application/json" -Body "{}"
              if ($s.native) { $result = "window open"; break }
              if ($s.native_broken) { $result = "window failed: $($s.native_broken.reason)"; break }
            } catch {}
          }
          Write-Host "Result: $result"
          Write-Host "---- ModHub's log ----"
          Get-Content "$dir\modhub.log" -ErrorAction SilentlyContinue | Select-Object -Last 120
          Get-Process ModHub -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($result -ne "window open") { exit 1 }
          Write-Host "ModHub opened its own window, as it should."
      - name: Build a console copy for diagnostics
        if: failure()
        run: >-
          pyinstaller --noconfirm --onefile --console
          --name ModHubDebug --distpath debugdist --workpath debugbuild
          --add-data "modhub.py;." --paths .
          --collect-all webview --collect-all pythonnet --collect-all clr_loader
          --hidden-import clr --hidden-import webview.platforms.edgechromium --hidden-import webview.platforms.winforms
          exe/launcher.py
      - name: Window engine diagnostics
        shell: pwsh
        if: failure()
        run: |
          python -c "import webview, sys; print('pywebview', getattr(webview, '__version__', '?'), 'on', sys.version)"
          pip show pythonnet clr_loader pywebview | Select-String "Name|Version"
          $app = "$env:USERPROFILE\.modhub\app"
          New-Item -ItemType Directory -Force $app | Out-Null
          Copy-Item modhub.py "$app\modhub.py" -Force
          $p = Start-Process debugdist\ModHubDebug.exe -ArgumentList "`"$app\modhub.py`"","--window","http://127.0.0.1:9/?t=x","--child" -NoNewWindow -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep 25
          Write-Host "still running after 25s: $(-not $p.HasExited)  exit code: $($p.ExitCode)"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "---- stdout ----"; Get-Content out.txt -ErrorAction SilentlyContinue
          Write-Host "---- stderr ----"; Get-Content err.txt -ErrorAction SilentlyContinue
          Write-Host "---- log ----"; Get-Content "$env:USERPROFILE\.modhub\modhub.log" -ErrorAction SilentlyContinue | Select-Object -Last 60
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/ModHub.exe
            build/notes.md
            build/defender.json

  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple chips
            zip: ModHub-mac.zip
          - runner: macos-15-intel     # older Intel Macs
            zip: ModHub-mac-intel.zip
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.zip == 'ModHub-mac-intel.zip' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the builder
        run: python -m pip install --upgrade pip pyinstaller pywebview
      - name: Make the icon
        run: python exe/prepare.py
      - name: Build ModHub.app
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name ModHub --icon build/modhub.icns
          --osx-bundle-identifier io.github.modhub-mc
          --add-data "modhub.py:." --paths .
          --collect-all webview
          exe/launcher.py
      - name: Finish the app
        run: |
          v=$(python -c "import re;print(re.search(r'^APP_VERSION = \"([^\"]+)\"', open('modhub.py', encoding='utf-8').read(), re.M).group(1))")
          plist=dist/ModHub.app/Contents/Info.plist
          plutil -replace LSUIElement -bool true "$plist"
          plutil -replace CFBundleShortVersionString -string "$v" "$plist"
          plutil -replace CFBundleVersion -string "$v" "$plist"
          codesign --force --deep -s - dist/ModHub.app
      - name: Check that it starts
        run: |
          dist/ModHub.app/Contents/MacOS/ModHub --no-browser --port 47999 &
          pid=$!
          code=000
          for i in $(seq 1 30); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:47999/ || true)
            [ "$code" != "000" ] && break
          done
          kill $pid 2>/dev/null || true
          pkill -f ModHub.app 2>/dev/null || true
          if [ "$code" != "403" ]; then
            echo "ModHub.app didn't start (got $code). Its log:"
            cat ~/.modhub/modhub.log 2>/dev/null || true
            exit 1
          fi
          echo "ModHub.app started and answered, as it should."
      - name: Zip it
        run: ditto -c -k --keepParent dist/ModHub.app "${{ matrix.zip }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  publish:
    needs: [windows, mac]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Scan everything with ClamAV
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clamav > /dev/null
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet || sudo freshclam
          mkdir scan
          cp out/windows/dist/ModHub.exe scan/
          for z in ModHub-mac.zip ModHub-mac-intel.zip; do [ -f "out/$z/$z" ] && cp "out/$z/$z" scan/; done
          set +e; clamscan --scan-archive=yes --max-filesize=200M --max-scansize=400M -r scan | tee clam.txt; code=${PIPESTATUS[0]}; set -e
          ver=$(clamscan --version)
          if [ "$code" = "0" ]; then r=clean; elif [ "$code" = "1" ]; then r=threat; else r=error; fi
          echo "{\"engine\":\"ClamAV\",\"result\":\"$r\",\"version\":\"$ver\"}" > clam.json
          echo "ClamAV: $r ($ver)"
          if [ "$r" = "threat" ]; then echo "ClamAV flagged a file, so nothing will be published."; exit 1; fi
      - name: Check with VirusTotal (if a key is set up)
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          echo "[]" > vt.json
          if [ -z "$VT_API_KEY" ]; then echo "No VT_API_KEY secret, skipping VirusTotal."; exit 0; fi
          python3 - <<'PY'
          import json, os, time, hashlib, urllib.request, uuid, pathlib
          key = os.environ["VT_API_KEY"]; out = []
          def call(url, data=None, ctype=None):
              req = urllib.request.Request(url, data=data, headers={"x-apikey": key, **({"Content-Type": ctype} if ctype else {})})
              with urllib.request.urlopen(req, timeout=300) as r: return json.load(r)
          for f in sorted(pathlib.Path("scan").iterdir()):
              sha = hashlib.sha256(f.read_bytes()).hexdigest()
              try:
                  up = call("https://www.virustotal.com/api/v3/files/upload_url")["data"]
                  b = uuid.uuid4().hex
                  body = (f"--{b}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"{f.name}\"\r\nContent-Type: application/octet-stream\r\n\r\n").encode() + f.read_bytes() + f"\r\n--{b}--\r\n".encode()
                  aid = call(up, body, f"multipart/form-data; boundary={b}")["data"]["id"]
                  stats = None
                  for _ in range(40):
                      time.sleep(20)
                      a = call(f"https://www.virustotal.com/api/v3/analyses/{aid}")["data"]["attributes"]
                      if a["status"] == "completed": stats = a["stats"]; break
                  if stats:
                      out.append({"file": f.name, "sha256": sha, "flagged": stats.get("malicious", 0), "suspicious": stats.get("suspicious", 0),
                                  "engines": sum(stats.get(k, 0) for k in ("malicious", "suspicious", "undetected", "harmless")),
                                  "link": f"https://www.virustotal.com/gui/file/{sha}"})
                      print(f.name, stats)
              except Exception as e:
                  print("VirusTotal skipped", f.name, e)
          json.dump(out, open("vt.json", "w"))
          PY
      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import re;print(re.search(r'^APP_VERSION = \"([^\"]+)\"', open('modhub.py', encoding='utf-8').read(), re.M).group(1))")
          tag="v$v"
          files="out/windows/dist/ModHub.exe"
          for z in ModHub-mac.zip ModHub-mac-intel.zip; do
            [ -f "out/$z/$z" ] && files="$files out/$z/$z"
          done
          python3 - <<'PY'
          import json, hashlib, pathlib, datetime
          d = json.loads(pathlib.Path("out/windows/build/defender.json").read_text(encoding="utf-8-sig"))
          c = json.loads(pathlib.Path("clam.json").read_text())
          vt = json.loads(pathlib.Path("vt.json").read_text())
          files = [{"file": f.name, "sha256": hashlib.sha256(f.read_bytes()).hexdigest(), "size": f.stat().st_size} for f in sorted(pathlib.Path("scan").iterdir())]
          scan = {"date": datetime.date.today().isoformat(), "scanners": [d, c], "files": files, "virustotal": vt}
          word = {"clean": "no threats found", "threat": "flagged", "error": "couldn't finish"}
          lines = ["", "## Safety scan", "",
                   f"Every download was scanned on {scan['date']} before it was published.", "",
                   f"- **Microsoft Defender** ({d.get('version', '')}): {word.get(d['result'], d['result'])} in ModHub.exe",
                   f"- **ClamAV** ({c.get('version', '')}): {word.get(c['result'], c['result'])} in every file"]
          for v in vt:
              lines.append(f"- **VirusTotal**, {v['file']}: {v['flagged']} of {v['engines']} engines flagged it ([full report]({v['link']}))")
          lines += ["", "SHA-256 checksums, so you can check your download is the real one:", "", "```"]
          lines += [f"{x['sha256']}  {x['file']}" for x in files] + ["```", "", "<!-- modhub-scan " + json.dumps(scan) + " -->"]
          notes = pathlib.Path("out/windows/build/notes.md").read_text(encoding="utf-8")
          pathlib.Path("notes-full.md").write_text(notes.rstrip() + "\n" + "\n".join(lines) + "\n", encoding="utf-8")
          PY
          echo "Publishing $tag: $files"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
            gh release edit "$tag" --notes-file notes-full.md
          else
            gh release create "$tag" $files --title "ModHub $v" --notes-file notes-full.md --latest
          fi
